services:
  rabbitmq:
    build: ./rabbitmq
    environment:
      # The RABBITMQ_DEFAULT_USER is used
      # to connect to the web admin
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
      RABBITMQ_LOGS: "DEBUG"
    networks:
      - docker-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 15s
      retries: 5
    ports:
      - "15672:15672" # Web admin port
      - "5672:5672" # Do not expose this port in production

  form_handler:
    build:
      context: python
      dockerfile: form_handler/Dockerfile-local
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure:20

    networks:
      - docker-network
    environment:
      RABBITMQ_URL: "rabbitmq"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASS: "${RABBITMQ_PASS}"
      VIPS_API_USERNAME: "${VIPS_API_USERNAME}"
      VIPS_API_PASSWORD: "${VIPS_API_PASSWORD}"
      VIPS_API_ROOT_URL: "${VIPS_API_ROOT_URL}"
      COMM_SERV_AUTH_URL: "${COMM_SERV_AUTH_URL}"
      COMM_SERV_API_ROOT_URL: "${COMM_SERV_API_ROOT_URL}"
      COMM_SERV_REALM: "${COMM_SERV_REALM}"
      COMM_SERV_CLIENT_ID: "${COMM_SERV_CLIENT_ID}"
      COMM_SERV_CLIENT_SECRET: "${COMM_SERV_CLIENT_SECRET}"
      ADMIN_EMAIL_ADDRESS: "${ADMIN_EMAIL_ADDRESS}"
      BCC_EMAIL_ADDRESSES: "${BCC_EMAIL_ADDRESSES}"
      VIPS_BCC_EMAIL_ADDRESSES: "${VIPS_BCC_EMAIL_ADDRESSES}"
      LOG_LEVEL: "DEBUG"
      ENCRYPT_KEY: "${ENCRYPT_KEY}"
      ICBC_API_ROOT: "${ICBC_API_ROOT}" # "http://mock_svcs:5003"
      ICBC_API_SUBMIT_ROOT: "${ICBC_API_SUBMIT_ROOT}"
      ICBC_API_USERNAME: "${ICBC_API_USERNAME}"
      ICBC_API_PASSWORD: "${ICBC_API_PASSWORD}"
      STORAGE_HOST: "minio"
      STORAGE_PORT: "9000"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY}"
      RIDE_API_URL: "${RIDE_API_URL}"
      RIDE_API_KEY: "${RIDE_API_KEY}"
      VIPS_DPS_EMAIL: "${VIPS_DPS_EMAIL}"
      GEOCODING_API_URL: "${GEOCODING_API_URL}"
      GEOCODING_API_KEY: "${GEOCODING_API_KEY}"
      ENVIRONMENT: "${ENVIRONMENT}"
      RSIOPS_EMAIL_ADDRESS: "${RSIOPS_EMAIL_ADDRESS}"
      FORMIO_API_URL: "${FORMIO_API_URL}"
      FORMIO_ROOT_EMAIL: "${FORMIO_ROOT_EMAIL}"
      FORMIO_ROOT_PASSWORD: "${FORMIO_ROOT_PASSWORD}"
      REACT_APP_BASE_URL: "${REACT_APP_BASE_URL}"
      FORMSFLOW_API_URL: "${FORMSFLOW_API_URL}"
      KEYCLOAK_URL: "${KEYCLOAK_URL}"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      FORM_HANDLER_KEYCLOAK_CLIENT_ID: "${FORM_HANDLER_KEYCLOAK_CLIENT_ID}"
      FORM_HANDLER_KEYCLOAK_CLIENT_SECRET: "${FORM_HANDLER_KEYCLOAK_CLIENT_SECRET}"


  task_scheduler:
    build:
      context: python
      dockerfile: task_scheduler/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: on-failure:20
    networks:
      - docker-network
    env_file:
      - .env      
    environment:
      DB_HOST: "db"
      RABBITMQ_URL: "rabbitmq"
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASS: "${RABBITMQ_PASS}"
      VIPS_API_USERNAME: "${VIPS_API_USERNAME}"
      VIPS_API_PASSWORD: "${VIPS_API_PASSWORD}"
      VIPS_API_ROOT_URL: "${VIPS_API_ROOT_URL}"
      COMM_SERV_AUTH_URL: "${COMM_SERV_AUTH_URL}"
      COMM_SERV_API_ROOT_URL: "${COMM_SERV_API_ROOT_URL}"
      COMM_SERV_REALM: "${COMM_SERV_REALM}"
      COMM_SERV_CLIENT_ID: "${COMM_SERV_CLIENT_ID}"
      COMM_SERV_CLIENT_SECRET: "${COMM_SERV_CLIENT_SECRET}"
      ADMIN_EMAIL_ADDRESS: "a@a.com"
      BCC_EMAIL_ADDRESSES: "$a@a.com"
      LOG_LEVEL: "DEBUG"
      ENCRYPT_KEY: "${ENCRYPT_KEY}"
      ICBC_API_ROOT: "http://mock_svcs:5003"
      STORAGE_HOST: "minio"
      STORAGE_PORT: "9000"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY}"      
      ENVIRONMENT: "${ENVIRONMENT}"


  # web_app:
  #   build:
  #     context: roadside-forms-frontend/frontend_web_app
  #     dockerfile: Dockerfile-local
  #     args:
  #       REACT_APP_BASE_URL: "${REACT_APP_BASE_URL_DEV}"
  #       REACT_APP_KEYCLOAK_URL: "${REACT_APP_KEYCLOAK_URL}"
  #       REACT_APP_KEYCLOAK_REALM: "${REACT_APP_KEYCLOAK_REALM}"
  #       REACT_APP_KEYCLOAK_CLIENT_ID: "${REACT_APP_KEYCLOAK_CLIENT_ID}"
  #       REACT_APP_API_BASE_URL: "${REACT_APP_API_BASE_URL}"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - roadside-forms-api
  #   networks:
  #     - docker-network
  #   ports:
  #     - "3000:5000"

  minio:
    image: "minio/minio:latest"
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9090}:9090"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      BITNAMI_DEBUG: "true"
      SSL_ENABLED: "false"
      MINIO_NOTIFY_AMQP_ENABLE_DF_RABBITMQ: "on"
      MINIO_NOTIFY_AMQP_URL_DF_RABBITMQ: "amqp://admin:password@rabbitmq:5672"
      MINIO_NOTIFY_AMQP_EXCHANGE_DF_RABBITMQ: "amq.direct"
      MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_DF_RABBITMQ: "direct"
      MINIO_NOTIFY_AMQP_ROUTING_KEY_DF_RABBITMQ: "dfevents"
      MINIO_NOTIFY_AMQP_AUTO_DELETED_DF_RABBITMQ: "off"
      MINIO_NOTIFY_AMQP_DELIVERY_MODE_DF_RABBITMQ: "2"
      MINIO_NOTIFY_AMQP_MANDATORY_DF_RABBITMQ: "off"
      MINIO_NOTIFY_AMQP_IMMEDIATE_DF_RABBITMQ: "off"
      MINIO_NOTIFY_AMQP_INTERNAL_DF_RABBITMQ: "off"
      MINIO_NOTIFY_AMQP_NO_WAIT_DF_RABBITMQ: "on"
      MINIO_NOTIFY_AMQP_DURABLE_DF_RABBITMQ: "on"
      MINIO_NOTIFY_AMQP_QUEUE_DIR_DF_RABBITMQ: "/opt/events"
      MINIO_NOTIFY_AMQP_QUEUE_LIMIT_DF_RABBITMQ: "100"
      MINIO_ACCESS_KEY: "minio"
      MINIO_SECRET_KEY: "minio123"
    volumes:
      - "minio:/data/minio"
    command: minio server /data/minio --console-address ":9090"
    networks:
      - docker-network

  roadside-forms-api:
    build:
      context: python
      dockerfile: prohibition_web_svc/Dockerfile-local
    env_file:
      - .env
    environment:
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      ICBC_API_ROOT: "http://mock_svcs:5000/vips/icbc"
      #"${ICBC_API_ROOT}"
      ICBC_LOGIN_USER_ID: "${ICBC_LOGIN_USER_ID}"
      ICBC_API_USERNAME: "${ICBC_API_USERNAME}"
      ICBC_API_PASSWORD: "${ICBC_API_PASSWORD}"
      ACCESS_CONTROL_ALLOW_ORIGIN: "*"
      LOG_LEVEL: "DEBUG"
      KEYCLOAK_REALM: "${KEYCLOAK_REALM}"
      KEYCLOAK_AUTH_URL: "${KEYCLOAK_AUTH_URL}"
      KEYCLOAK_CLIENT_ID: "${KEYCLOAK_CLIENT_ID}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      FLASK_BASIC_AUTH_USER: "${FLASK_BASIC_AUTH_USER}"
      FLASK_BASIC_AUTH_PASS: "${FLASK_BASIC_AUTH_PASS}"
      MINIO_BUCKET_URL: "minio:9000"
      MINIO_SK: "${MINIO_SK}"
      MINIO_AK: "${MINIO_AK}"
      DB_HOST: "db"
      REACT_APP_BASE_URL: "${REACT_APP_BASE_URL}"
      ENVIRONMENT: "${ENVIRONMENT}"
    command: bash -c "cd /home/appuser/python/prohibition_web_svc && flask db upgrade && cd /home/appuser && gunicorn --bind 0.0.0.0:5000 --pythonpath /home/appuser/python/prohibition_web_svc 'app:create_app()'"
    networks:
      - docker-network
    # network_mode: "host"
    ports:
      - "5002:5000"
    x-develop:
      watch:
        - action: rebuild
          path: "./python/prohibition_web_svc"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=test
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - docker-network
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "test", "-U", "testuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock_svcs:
    build:
      context: mock_services
      dockerfile: all_mock_svc/Dockerfile-local
    environment:
      FLASK_SECRET_KEY: 1234
      API_USERNAME: user
      API_PASSWORD: password
      LOG_LEVEL: "DEBUG"
    networks:
      - docker-network
    ports:
      - "5003:5000"

  keycloak:
    image: keycloak/keycloak:26.4
    command: >
      start-dev
      --http-port=8080
      --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      KEYCLOAK_DATABASE_HOST: "${KEYCLOAK_DATABASE_HOST}"
      KEYCLOAK_DATABASE_PORT: "${KEYCLOAK_DATABASE_PORT}"
      KEYCLOAK_DATABASE_USER: "${KEYCLOAK_DATABASE_USER}"
      KEYCLOAK_DATABASE_PASSWORD: "${KEYCLOAK_DATABASE_PASSWORD}"
      KEYCLOAK_LOG_LEVEL: "INFO"
      KEYCLOAK_ROOT_LOG_LEVEL: INFO
    depends_on:
      - db
    ports:
      - "8083:8080"
    networks:
      - docker-network

networks:
  docker-network:

volumes:
  db: {}
  minio:
    driver: local
